name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to a branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  # Keep in step with the version pinned in tools/go.mod.
  SQLC_VERSION: "1.31.1"

jobs:
  # The single most valuable check in this workflow: build with no npm involved.
  #
  # go:embed needs internal/frontend/dist to be non-empty, which a committed
  # placeholder guarantees. Vite's emptyOutDir once deleted that placeholder, and
  # because every developer machine has a real build sitting in that directory the
  # breakage was invisible locally — only a fresh checkout hit it. This job is that
  # fresh checkout.
  clean-build:
    name: Build without the frontend toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go build (no npm run build first)
        run: go build ./...

      - name: The binary must run and report the UI as missing, not crash
        run: |
          go build -o /tmp/manualbox ./cmd/manualbox
          /tmp/manualbox version
          /tmp/manualbox doctor

  # This repository is public and meant to be picked up by other people. Personal
  # data must never land in it — not just for privacy, but so it reads as a clean
  # project rather than someone's private inventory. Cheap grep, catches the ways
  # it actually happens.
  hygiene:
    name: No personal data in the repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Absolute home paths (they carry an OS username)
        run: |
          if git grep -nIE '/Users/[a-z]+|/home/[a-z]+/|C:\\\\Users' -- . ':!deploy/Dockerfile' ':!docs/**'; then
            echo "::error::an absolute home directory path is committed; it identifies whose machine it came from"
            exit 1
          fi

      - name: Email addresses outside the reserved example domains
        run: |
          if git grep -hIoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . \
             | grep -viE 'example\.(com|org|net)|@users\.noreply\.github\.com|noreply@|anthropic\.com|githubcopilot\.com|@v[0-9]' \
             | sort -u | grep .; then
            echo "::error::a real-looking email address is committed; use an example.com address (RFC 2606)"
            exit 1
          fi

      - name: Committed database or archive files
        run: |
          if git ls-files | grep -iE '\.(db|db-wal|db-shm|sqlite3?)$|^data/'; then
            echo "::error::a database or data directory is committed"
            exit 1
          fi

      - name: Committed PDFs or images that could be someone's documents
        run: |
          if git ls-files | grep -iE '\.(pdf|jpg|jpeg|heic)$'; then
            echo "::error::a document or photo is committed; fixtures must be manifests (see docs/design/privacy.md)"
            exit 1
          fi

  go:
    name: Go tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # poppler and tesseract are optional at runtime, but installing them means
      # the tests exercise the paths that use them rather than skipping.
      - name: Install optional external tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu

      - name: go vet
        run: go vet ./...

      - name: Tests with the race detector
        run: go test -race -shuffle=on -timeout 10m ./...

      # sqlc output is committed, so a schema change without regenerating is a
      # drift bug waiting to happen.
      #
      # Uses the published sqlc image rather than building from source. Compiling
      # sqlc pulls in ClickHouse, the TiDB parser, and YDB drivers and takes
      # minutes — the whole reason the tools module is separate is to keep that
      # tree out of the build. It also needs a newer Go than manualbox targets,
      # which fought setup-go's GOTOOLCHAIN=local. The image is pinned to the same
      # version as tools/go.mod and produces byte-identical output.
      - name: Verify generated code is current
        run: |
          docker run --rm -v "$PWD":/src -w /src sqlc/sqlc:${{ env.SQLC_VERSION }} generate
          if ! git diff --exit-code internal/db/gen; then
            echo "::error::internal/db/gen is out of date — run 'make sqlc' and commit the result"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to the version used locally so CI and `make lint` agree.
          version: v2.5.0

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      # node --test, running the TypeScript directly by stripping the types. Needs
      # Node 22.18 or newer for that to be on without a flag; NODE_VERSION is "22",
      # which setup-node resolves to the latest 22.x.
      - name: Test
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Fail on known vulnerabilities
        run: npm audit --audit-level=high
        working-directory: web

  # Builds the real image and proves it serves traffic, rather than only that the
  # Dockerfile parses.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: manualbox:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image must serve the API and the embedded UI
        run: |
          docker run -d --name mb -p 7745:7745 manualbox:ci
          for _ in $(seq 1 60); do
            curl -sf http://localhost:7745/api/v1/health >/dev/null && break
            sleep 1
          done

          echo "--- health ---"
          curl -sf http://localhost:7745/api/v1/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          echo "--- the SPA is embedded ---"
          curl -sf http://localhost:7745/ | grep -q 'id="root"'

          echo "--- external tools are present in the image ---"
          # The binary must be named explicitly: docker exec does not go through
          # the image ENTRYPOINT, so `docker exec mb doctor` looks for a binary
          # literally called "doctor" and fails.
          docker exec mb manualbox doctor | tee /tmp/doctor.txt
          grep -q "5 of 5 optional external tools available" /tmp/doctor.txt

          echo "--- it does not run as root ---"
          test "$(docker exec mb id -u)" = "10001"

          echo "--- first-run setup works ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:7745/api/v1/setup \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"a sufficiently long passphrase"}')
          test "$code" = "201"

          echo "--- it shuts down cleanly ---"
          docker stop -t 20 mb
          docker logs mb 2>&1 | grep -q "stopped cleanly"

      - name: Container logs on failure
        if: failure()
        run: docker logs mb || true
